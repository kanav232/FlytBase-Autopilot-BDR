<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbound BDR Agent - Live Demo</title>
    <!-- Marked.js for rendering the markdown response -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #334155;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 40px;
            box-sizing: border-box;
        }
        h1 { 
            margin-top: 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .links a {
            font-size: 14px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            background: #e0f2fe;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .links a:hover {
            background: #bae6fd;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            margin-bottom: 20px;
            box-sizing: border-box;
            resize: vertical;
            background: #f8fafc;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        .output-container {
            margin-top: 40px;
            display: none;
        }
        .output-container h3 {
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .output-content {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 20px 30px;
            border-radius: 8px;
            overflow-x: auto;
            line-height: 1.6;
        }
        .loader {
            display: none;
            text-align: center;
            margin-top: 25px;
            font-weight: 600;
            color: var(--primary);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            🚀 BDR Agent Webhook
            <span class="links"><a href="/mindmap.html" target="_blank">🧠 View Mindmap</a></span>
        </h1>
        <p>Paste an inbound lead email below to test the automated qualification, research, and response generation in real-time.</p>
        
        <textarea id="emailInput">From: Rodrigo Castillo (r.castillo@sqm.cl)
Title: Head of Operations, Northern Operations Division
Company: Sociedad Quimica y Minera de Chile (SQM), Chile
Subject: Autonomous inspection for our Atacama lithium sites
Context: Looking for drone-based inspection for 3 large-scale, 24/7 lithium extraction sites in the Atacama Desert. Contracted crews are expensive and hazardous. Referred by Anglo American. Internal budget allocated for Q3 rollout.</textarea>
        
        <button id="runBtn" onclick="runAgent()">Run BDR Agent</button>
        
        <div class="loader" id="loader">
            🤖 Agent is processing... (Extracting MEDDPICC, researching SQM, drafting sequence...)
        </div>

        <div class="output-container" id="outputContainer">
            <h3>📝 Final AE Handoff Document</h3>
            <div class="output-content" id="outputContent"></div>
        </div>
    </div>

    <script>
        async function runAgent() {
            const btn = document.getElementById('runBtn');
            const loader = document.getElementById('loader');
            const outputContainer = document.getElementById('outputContainer');
            const outputContent = document.getElementById('outputContent');
            const emailText = document.getElementById('emailInput').value;

            // Reset UI
            btn.disabled = true;
            btn.innerText = "Running...";
            loader.style.display = 'block';
            outputContainer.style.display = 'none';

            try {
                // Call our serverless Vercel function
                const response = await fetch('/api/webhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: emailText
                });

                if (!response.ok) {
                    throw new Error(`Server returned HTTP ${response.status}`);
                }

                const resultMarkdown = await response.text();
                
                // Parse markdown to HTML
                outputContent.innerHTML = marked.parse(resultMarkdown);
                outputContainer.style.display = 'block';
            } catch (error) {
                outputContent.innerHTML = `<span style="color:red"><b>Error:</b> ${error.message} - Ensure your GROQ_API_KEY is set in Vercel.</span>`;
                outputContainer.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "Run BDR Agent";
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
